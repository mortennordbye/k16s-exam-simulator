id: 05-cis-apiserver-profiling
title: Disable kube-apiserver Profiling (CIS 1.2.15)
weight: 4
context: ssh controlplane
description: |
  CIS Benchmark 1.2.15 requires that profiling is disabled on the API server.

  1. Edit `/etc/kubernetes/manifests/kube-apiserver.yaml`
  2. Ensure the flag `--profiling=false` is present in the `kube-apiserver` command args

  The API server must run again with the new flag.

  **Note:** The static pod will restart automatically after you save the manifest.
hint: |
  Add `- --profiling=false` to the `command:` list in the kube-apiserver manifest.
  Check the running process: `ps -ef | grep kube-apiserver | grep profiling`.
