id: 04-rbac-serviceaccount
title: Reduce ServiceAccount Permissions
weight: 8
context: ssh controlplane
description: |
  ServiceAccount `deployer` in namespace `ci` is bound to `cluster-admin` by the ClusterRoleBinding `deployer-admin`. This is too much access.

  1. Remove the cluster-wide access of `deployer`.
  2. Create a Role `deployer-role` in namespace `ci` that allows only:
     - `get`, `list`, `watch`, `create`, `update`, `patch` on `deployments`
     - `get`, `list` on `pods`
  3. Bind it to `deployer` with a RoleBinding `deployer-rb` in namespace `ci`.
  4. The pods of deployment `ci-runner` (they use `deployer`) must not mount a ServiceAccount token. Make sure the running pods have no token.
hint: "Test with `kubectl auth can-i <verb> <resource> -n ci --as=system:serviceaccount:ci:deployer`."
