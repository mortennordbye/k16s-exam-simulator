id: 17-apiserver-anon-noderestriction
requires: heavy
title: Restrict Anonymous Access and Enable NodeRestriction
weight: 6
context: ssh controlplane
description: |
  A security review found two problems with the kube-apiserver on `controlplane`:

  1. Anonymous requests are accepted on every endpoint. Anonymous requests must be rejected, except on the health endpoints `/livez`, `/readyz` and `/healthz` (the kubelet probes need them). Configure this with an `AuthenticationConfiguration` at `/etc/kubernetes/authn/authn-config.yaml` and pass it to the kube-apiserver with `--authentication-config`.
  2. The `NodeRestriction` admission plugin is not enabled. Enable it and keep the other admission plugins.

  Make sure the kube-apiserver is running and ready again when you are done.
hint: "`apiVersion: apiserver.config.k8s.io/v1`, `kind: AuthenticationConfiguration`, field `anonymous` with `enabled` and `conditions` (a list of `path`). Do not combine it with the `--anonymous-auth` flag. The kube-apiserver container needs a hostPath volume for `/etc/kubernetes/authn`."
