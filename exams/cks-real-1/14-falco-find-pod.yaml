id: 14-falco-find-pod
requires: heavy
title: Find a Suspicious Pod with Falco
weight: 6
context: ssh controlplane
description: |
  Falco runs on `controlplane` as the systemd service `falco`. Its alerts go to the journal (`journalctl -u falco`).

  One pod in the cluster reads the sensitive file `/etc/shadow` again and again.

  1. Find this pod with Falco.
  2. Scale the deployment that owns this pod to `0` replicas. Do not change other deployments.
  3. Write the namespace and the name of the pod to `/opt/cks-falco/suspicious-pod.txt` in the format `<namespace>/<pod-name>`.
hint: "Falco alerts include `k8s_ns_name` and `k8s_pod_name`. Search the journal for `shadow`."
