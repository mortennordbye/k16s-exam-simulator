id: 16-immutable-container
title: Make a Container Immutable
weight: 6
context: ssh controlplane
description: |
  Deployment `frontend` in namespace `immutable` runs nginx. Make its containers immutable at runtime:

  - The root filesystem of the container must be read-only.
  - Privilege escalation must not be allowed.
  - nginx must still run. It writes to `/var/cache/nginx`, `/var/run` and `/tmp`: give each of these paths its own `emptyDir` volume.

  All `2` replicas must be ready. Keep the image.
hint: "Use the container `securityContext`. Check the pod logs if nginx does not start."
