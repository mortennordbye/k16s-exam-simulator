id: 05-pki-csr
title: Create and Approve a Certificate Signing Request for a User
weight: 5
context: controlplane
description: |
  A private key for user **alice** exists at `/opt/cks-pki/alice.key`.

  1. Using this key, create a Certificate Signing Request (CSR) at `/opt/cks-pki/alice.csr` with:
     - **CN** (Common Name): `alice`
     - **O** (Organization): `dev`
     - **O** (Organization): `ops`

     (The user alice is a member of both the `dev` and `ops` groups.)

  2. Submit it as a Kubernetes `CertificateSigningRequest` named `alice` (signer `kubernetes.io/kube-apiserver-client`), approve it, and save the issued certificate to `/opt/cks-pki/alice.crt`.
hint: "Use `openssl req -new -key alice.key -out alice.csr -subj '/CN=alice/O=dev/O=ops'`. The CSR object takes the base64 CSR in `spec.request` and `usages: [client auth]`. Then `kubectl certificate approve alice` and read `.status.certificate` (base64)."
