id: b10-secret-volume
title: Mount a Secret as a Read-Only Volume
weight: 5
context: ""
description: |
  Pod `app` in namespace `orders` reads secret `db-secret` through environment variables. Environment variables leak easily, for example in crash dumps and logs.

  1. Change pod `app` so that it no longer gets any secret value through environment variables. Instead, mount secret `db-secret` **read-only** at `/etc/db-secret`. Keep the pod name, image and command.
  2. Namespace `orders` also has secret `legacy-token`. Write the decoded value of its key `token` to `/opt/cks-secrets/legacy-token.txt`.
hint: "Export the pod with `kubectl get pod app -o yaml`, edit it, then `kubectl replace --force -f`. Secret data is base64 encoded."
