id: 01-netpol-https-egress
title: Allow HTTPS Egress While Blocking Cloud Metadata and Private Ranges
weight: 8
context: ""
description: |
  Namespace `netpol-external` contains pods with label `app=client`.

  1. Create a **default-deny egress** NetworkPolicy named `deny-all-egress` that applies to all pods in `netpol-external` (`policyTypes: [Egress]`, no egress rules)

  2. Create a NetworkPolicy named `allow-external-https` in namespace `netpol-external` that:
     - Applies to pods with label `app=client`
     - Allows **egress** to CIDR `0.0.0.0/0` on **TCP port 443**
     - **Blocks** (using `except`) the cloud metadata endpoint `169.254.169.254/32` and the internal range `10.10.0.0/16`
     - Allows **egress** to namespace `kube-system` on **UDP and TCP port 53** for DNS

  3. Save the `allow-external-https` policy YAML to `/opt/cks3-netpol/allow-external-https.yaml`
hint: |
  The `ipBlock` for HTTPS egress looks like:
  ```yaml
  - ipBlock:
      cidr: 0.0.0.0/0
      except:
      - 169.254.169.254/32
      - 10.10.0.0/16
  ```
  Add a separate egress rule for DNS: `namespaceSelector` with `kubernetes.io/metadata.name: kube-system` on UDP 53 and TCP 53.
